name: Release Android

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Test
        run: make test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        # setup-android@v3 已不可用（其内部跑已移除的 `sdkmanager tools`），改为手动
        # 定位镜像预装的 SDK：导出 ANDROID_HOME 与 sdkmanager 进 PATH（后续 NDK
        # 安装、gradle、gomobile 都依赖），再接受全部 license。
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$sdk" ]; then echo "Android SDK missing at $sdk" >&2; exit 1; fi
          bin="$(command -v sdkmanager || true)"
          if [ -z "$bin" ]; then
            bin="$(ls "$sdk"/cmdline-tools/latest/bin/sdkmanager "$sdk"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          fi
          if [ -z "$bin" ] || [ ! -x "$bin" ]; then echo "sdkmanager not found under $sdk" >&2; exit 1; fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
          yes | "$bin" --licenses >/dev/null

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Import release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export KEYSTORE="$GITHUB_WORKSPACE/android/release.jks"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          keystore = Path(os.environ["KEYSTORE"])
          keystore.write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"]))
          props = keystore.parent / "keystore.properties"
          props.write_text(
              f"storeFile={keystore}\n"
              f"storePassword={os.environ['ANDROID_KEYSTORE_PASSWORD']}\n"
              f"keyAlias={os.environ['ANDROID_KEY_ALIAS']}\n"
              f"keyPassword={os.environ['ANDROID_KEY_PASSWORD']}\n"
          )
          PY

      - name: Build Android Release APKs
        run: |
          set -e
          # 本线不跑 make release-cli, dist/ 不会自动创建。
          mkdir -p dist
          # 依次产出 arm64 与 x86_64 (模拟器) 两个 release 包。
          # 换 ABI 前 gradle clean, 防止上一个架构的 libgojni.so 残留进 APK。
          # asset 文件名去掉 android- 前缀 (update.AssetName 依赖 snirect-android-<abi>-vX.Y.Z.apk 形状)。
          build_apk() {
            arch="$1"  # gomobile -target 架构
            abi="$2"   # gradle abiFilters
            name="$3"  # release asset 文件名段 (update.AssetName 依赖)
            ( cd android && ./gradlew clean >/dev/null )
            make core ARCH="android/${arch}"
            make app BUILD_TYPE=Release ABI="${abi}"
            apk="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)"
            if [ -n "$apk" ]; then
              cp "$apk" "dist/snirect-android-${name}-${GITHUB_REF_NAME#android-}.apk"
            fi
          }
          build_apk arm64 arm64-v8a arm64
          build_apk amd64 x86_64 x86_64

      - name: Generate Checksums
        run: make checksum

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
