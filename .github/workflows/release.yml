name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Test
        run: make test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install UPX & gomobile
        run: |
          sudo apt-get update && sudo apt-get install -y upx-ucl
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build CLI binaries
        run: make release-cli

      - name: Import release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export KEYSTORE="$GITHUB_WORKSPACE/android/release.jks"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          keystore = Path(os.environ["KEYSTORE"])
          keystore.write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"]))
          props = keystore.parent / "keystore.properties"
          props.write_text(
              f"storeFile={keystore}\n"
              f"storePassword={os.environ['ANDROID_KEYSTORE_PASSWORD']}\n"
              f"keyAlias={os.environ['ANDROID_KEY_ALIAS']}\n"
              f"keyPassword={os.environ['ANDROID_KEY_PASSWORD']}\n"
          )
          PY

      - name: Build Android Release APKs
        run: |
          set -e
          # 依次产出 arm64 与 x86_64 (模拟器) 两个 release 包。
          # 换 ABI 前 gradle clean, 防止上一个架构的 libgojni.so 残留进 APK。
          build_apk() {
            arch="$1"  # gomobile -target 架构
            abi="$2"   # gradle abiFilters
            name="$3"  # release asset 文件名段 (update.AssetName 依赖)
            ( cd android && ./gradlew clean >/dev/null )
            make core ARCH="android/${arch}"
            make app BUILD_TYPE=Release ABI="${abi}"
            apk="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)"
            if [ -n "$apk" ]; then
              cp "$apk" "dist/snirect-android-${name}-${GITHUB_REF_NAME}.apk"
            fi
          }
          build_apk arm64 arm64-v8a arm64
          build_apk amd64 x86_64 x86_64

      - name: Generate Checksums
        run: make checksum

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  aur-sync:
    name: Sync AUR packages
    needs: build-and-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    timeout-minutes: 10
    steps:
      - name: Install tools
        run: pacman -Sy --noconfirm git openssh

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AUR SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::secret AUR_SSH_PRIVATE_KEY is not set; add the AUR account key to repo secrets"
            exit 1
          fi
          mkdir -m 700 -p /root/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /root/.ssh/aur_key
          chmod 600 /root/.ssh/aur_key
          ssh-keyscan aur.archlinux.org >> /root/.ssh/known_hosts
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile /root/.ssh/aur_key\n' > /root/.ssh/config

      - name: Update AUR packages
        run: bash scripts/aur-update.sh "${GITHUB_REF_NAME#v}"
